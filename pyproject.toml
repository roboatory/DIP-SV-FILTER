[project]
name = "structural-variant-detection"
version = "0.1.0"
description = "Structural variant filtering with alignment features and a CNN-Transformer classifier"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pysam>=0.23.3",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "tqdm>=4.70.1",
    "wandb>=0.23.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pre-commit>=4.5.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "utils",
    "filter_contig_pairs",
    "realign_with_secondary",
    "align_cluster_reads_to_haps",
    "encode_pair_target_windows",
    "classify_contig_pairs",
    "export_filtered_vcf",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["construct_haplotypes*", "featurizers*", "models*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP032"]
